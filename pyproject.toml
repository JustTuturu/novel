[project]
name = "novel-ocr-sidecar"
version = "0.1.0"
description = "OCR sidecar for the Rust `novel` CLI (Qidian glyph maps, SFACG VIP images)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The CLI itself is Rust. Python exists only for OCR, so the dependency list is
# just the OCR engine plus its numpy stack — nothing from the old Python CLI
# (playwright, requests, selenium, …) is needed any more.
dependencies = [
    "paddleocr>=2.0.1",
    "paddlepaddle>=3.2.0",
    "numpy>=1.26",
    "pillow>=10.0.0",
    "opencv-python>=4.12.0.88",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel"]
