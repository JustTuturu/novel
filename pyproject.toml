[project]
name = "qidian"
version = "0.2.0"
description = "Extract, clean, and translate Chinese web-novel chapters (Qidian / QQ阅读)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.12.0.88",
    "easyocr>=1.6.2",
    "torch>=2.2.0",
    "playwright>=1.60.0",
    "beautifulsoup4>=4.15.0",
    "selenium>=4.48.0",
    "webdriver-manager>=4.1.2",
    "requests>=2.31.0",
]

[project.scripts]
qidian = "qidian.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qidian"]