[project]
name = "bookqq"
version = "0.2.0"
description = "Extract, clean, and translate Chinese web-novel chapters (Qidian / QQ阅读)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python>=4.12.0.88",
    "paddleocr>=2.0.1",
    "paddlepaddle>=3.2.0",
    "torch>=2.2.0",
    "playwright>=1.60.0",
    "beautifulsoup4>=4.15.0",
    "selenium>=4.48.0",
    "webdriver-manager>=4.1.2",
    "requests>=2.31.0",
]

[project.scripts]
bookqq = "bookqq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookqq"]

[tool.pyright]
venvPath = "."
venv = ".venv"
