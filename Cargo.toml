[package]
name = "novel"
version = "0.4.0"
edition = "2021"
rust-version = "1.98"
description = "Download Chinese web novels from Qidian and SFACG"
default-run = "novel"

[[bin]]
name = "novel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
ego-tree = "0.11"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "charset"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = true }
oar-ocr = "0.10.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
opt-level = 2
